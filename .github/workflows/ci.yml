name: CI

# No path filter. In the repository this workflow was extracted from, an
# unrelated Expo app shared the root and the filter existed to keep its
# commits from turning these checks red. This repository holds only Tenders
# Finder, so every change here is in scope and every push should be checked.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same branch. Without this the
# queue fills with runs against commits nobody is waiting on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service:
    name: scraper-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper-service/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # Playwright's browser is not installed: every test mocks the network
      # and the Anthropic client, so a browser download would add minutes to
      # each run for nothing. If a test ever needs a real browser, that is
      # the signal to add `playwright install --with-deps chromium` here.
      - name: Tests
        env:
          # The suite must pass without credentials — that is the point of
          # the offline embedding provider. Pinning them here means a machine
          # with a stray .env cannot mask a test that secretly needs a key.
          EMBEDDING_PROVIDER: hash
          DRY_RUN: "true"
        run: pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  landing:
    name: landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The landing page has no build step, so there is nothing to compile —
      # but it is a single hand-written file, and the two things that broke it
      # before were both invisible in a source read. These are the cheap
      # structural checks; the rendered ones need a browser and live in the
      # session that edits the page.
      - name: Structural checks
        working-directory: landing
        run: |
          fail=0
          check() {
            if grep -q "$1" index.html; then
              echo "ok    $2"
            else
              echo "FAIL  $2"
              fail=1
            fi
          }
          # Without this a phone lays the page out at the 980px fallback
          # viewport and zooms out to unreadable text.
          check 'name="viewport"' "viewport meta present"
          check 'charset="utf-8"' "charset declared before any content"
          check 'document.documentElement.dir = "rtl"' "direction set for assistive tech"
          check 'property="og:image"' "sharing card declared"

          # Every mark on the page is cut from one image. The check that
          # matters is not that a logo file exists but that the page uses
          # *that* one: the defect this replaces was a hand-traced SVG that
          # sat in the header for weeks looking plausible and being wrong.
          absent() {
            if grep -q "$1" index.html; then
              echo "FAIL  $2"
              fail=1
            else
              echo "ok    $2"
            fi
          }
          absent 'viewBox="0 0 132 104"' "no traced logo left in the page"

          marks=$(grep -c 'class="brand-mark"' index.html)
          if [ "$marks" = "2" ]; then
            echo "ok    both brand marks use logo.png"
          else
            echo "FAIL  expected 2 brand marks, found $marks"
            fail=1
          fi

          check 'rel="canonical"' "canonical URL declared"
          check 'application/ld+json' "structured data present"

          for f in og.png logo.png favicon-32.png apple-touch-icon.png                    robots.txt sitemap.xml llms.txt 404.html; do
            test -f "$f" && echo "ok    $f present" || { echo "FAIL  $f missing"; fail=1; }
          done

          # A 404 that search engines index is worse than no 404 page.
          grep -q 'name="robots" content="noindex' 404.html             && echo "ok    404 page is noindex"             || { echo "FAIL  404 page is missing noindex"; fail=1; }

          python3 - <<'PY' || fail=1
          import json, re, sys, xml.dom.minidom
          html = open("index.html", encoding="utf-8").read()
          blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          try:
              for b in blocks: json.loads(b)
              print("ok    JSON-LD parses (%d block(s))" % len(blocks))
          except Exception as e:
              print("FAIL  JSON-LD is not valid JSON: %s" % e); sys.exit(1)
          try:
              xml.dom.minidom.parse("sitemap.xml"); print("ok    sitemap.xml is well-formed")
          except Exception as e:
              print("FAIL  sitemap.xml is malformed: %s" % e); sys.exit(1)
          PY
          exit $fail
