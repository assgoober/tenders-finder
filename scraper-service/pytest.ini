[pytest]
testpaths = tests

# Put the service root on sys.path so `from app...` resolves.
#
# Without this, `pytest -q` — the command the README and CLAUDE.md both
# document — fails collection with "No module named 'app'", while
# `python -m pytest -q` passes, because that form prepends the working
# directory to sys.path and the bare entry point does not. The suite
# therefore only worked when invoked one particular way, and the documented
# way was the broken one. CI, which runs it as documented, is what surfaced
# that.
pythonpath = .

asyncio_mode = auto
# Pinned rather than left to the default: pytest-asyncio warns that the
# default fixture loop scope is changing in a future release, and an unset
# value means the suite would quietly change behaviour on an upgrade.
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning
